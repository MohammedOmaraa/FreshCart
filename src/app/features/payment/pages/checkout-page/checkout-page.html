<section class="max-w-4xl mx-auto py-4">
  <!-- Page Title -->
  <app-header-title [title]="'checkout.title' | translate" [customClasses]="'!text-5xl !mt-0 !mb-7  rtl:pb-2'" />

  <form [formGroup]="paymentForm" class="flex flex-col gap-8">

    <!-- ============ STEP 1 ============ -->
    <section class="flex flex-col gap-3">
      <div class="flex items-center gap-4 border-b border-primary-dark pb-2">
        <span class="size-9 rounded-full bg-primary text-white flex items-center justify-center font-bold">
          1
        </span>
        <h3 class="text-xl font-bold text-primary-darkest dark:text-white/90">
          {{ 'checkout.steps.shipping' | translate }}
        </h3>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- City -->
        <app-input formControlName="city" [control]="paymentForm.get('city')" [controlName]="'City'"
          [labelForId]="'city'" [labelText]="'checkout.form.city.label' | translate" [type]="'text'"
          [placeholder]="'checkout.form.city.placeholder' | translate" [icon]="icons.city" [errorMessages]="{
            required: ('validation.required' | translate)
          }" />

        <!-- Phone -->
        <app-input formControlName="phone" [control]="paymentForm.get('phone')" [controlName]="'Phone'"
          [labelForId]="'phone'" [labelText]="'checkout.form.phone.label' | translate" [type]="'text'"
          [placeholder]="'checkout.form.phone.placeholder' | translate" [icon]="icons.phone" [errorMessages]="{
            required: ('validation.required' | translate),
            pattern: ('validation.phone' | translate)
        }" />


        <!-- Address -->
        <div class="md:col-span-2">
          <app-textarea formControlName="details" [control]="paymentForm.get('details')" [controlName]="'Details'"
            [labelForId]="'address'" [labelText]="'checkout.form.address.label' | translate"
            [placeholder]="'checkout.form.address.placeholder' | translate" [icon]="icons.address" [errorMessages]="{
            required: ('validation.required' | translate)
        }" />
        </div>

      </div>
    </section>

    <!-- ============ STEP 2 ============ -->
    <section class="flex flex-col gap-6">

      <div class="flex items-center gap-4 border-b border-primary-dark pb-2">
        <span class="size-9 rounded-full bg-primary text-white flex items-center justify-center font-bold">
          2
        </span>
        <h3 class="text-xl font-bold text-primary-darkest dark:text-white/90">
          {{ 'checkout.steps.payment' | translate }}
        </h3>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Cash -->
        <div (click)="selectMethod('cash')" class="cursor-pointer p-6 rounded-3xl border-2 transition-all"
          [class.border-primary]="paymentMethod() === 'cash'" [class.bg-primary/10]="paymentMethod() === 'cash'"
          [class.border-primary-dark]="paymentMethod() !== 'cash'">
          <div class="flex flex-col items-center gap-3">

            <!-- Icon -->
            <div class="size-12 rounded-full bg-slate-700 flex items-center justify-center text-white" [class.!bg-primary]="paymentMethod() === 'cash'">
              <lucide-angular [img]="icons.cash" class="text-xl"></lucide-angular>
            </div>

            <!-- text -->
            <div class="text-center">
              <p class="text-lg text-primary-darker dark:text-white  font-medium">{{ 'checkout.paymentMethod.cash' |
                translate }}</p>
            </div>
          </div>
        </div>

        <!-- Online -->
        <div (click)="selectMethod('online')" class="cursor-pointer p-6 rounded-3xl border-2 transition-all"
          [class.border-primary]="paymentMethod() === 'online'" [class.bg-primary/10]="paymentMethod() === 'online'"
          [class.border-primary-dark]="paymentMethod() !== 'online'">
          <div class="flex flex-col items-center gap-3">
            <!-- Icon -->
            <div class="size-12 rounded-full bg-slate-700 flex items-center justify-center text-white" [class.!bg-primary]="paymentMethod() === 'online'">
              <lucide-angular [img]="icons.card" class="text-xl"></lucide-angular>
            </div>

            <!-- text -->
            <div class="text-center">
              <p class="text-lg text-primary-darker dark:text-white  font-medium">{{ 'checkout.paymentMethod.online' |
                translate }}</p>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- ============ CONFIRM BUTTON ============ -->
    <div class="flex justify-center mt-4">
      <button (click)="confirmOrder()"
        class="cursor-pointer group w-full max-w-xl h-16 bg-primary active:scale-[0.98]  rounded-full  flex items-center justify-center gap-2 transition-all  hover:shadow-lg hover:shadow-primary/50  text-white font-bold text-lg ">
        {{ 'checkout.actions.confirm' | translate }}

        <div class="group-hover:translate-x-1 rtl:group-hover:-translate-x-1 rtl:rotate-180 transition-transform">
          <lucide-angular [img]="icons.next" class="size-5"></lucide-angular>
        </div>
      </button>
    </div>

  </form>
</section>
