<section class="my-4">
  <app-header-title [title]="'Checkout Page'" />

  <div class="my-10 bg-gray-200 rounded-3xl p-4 w-1/2 mx-auto">
    <form [formGroup]="paymentForm">
      <!-- (input field): details -->
      <div class="relative mb-4">
        <label
          for="details"
          class="uppercase font-bold text-lg leading-7 text-gray-600"
          >Details</label
        >
        <input
          type="text"
          id="details"
          name="details"
          formControlName="details"
          class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"
        />
      </div>

      <!-- (input field): phone -->
      <div class="relative mb-4">
        <label
          for="phone"
          class="uppercase font-bold text-lg leading-7 text-gray-600"
          >Phone</label
        >
        <input
          type="text"
          id="phone"
          name="phone"
          formControlName="phone"
          class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"
        />
      </div>

      <!-- (input field): city -->
      <div class="relative mb-4">
        <label
          for="city"
          class="uppercase font-bold text-lg leading-7 text-gray-600"
          >City</label
        >
        <input
          type="text"
          id="city"
          name="city"
          formControlName="city"
          class="w-full bg-white rounded border border-gray-300 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-base outline-none text-gray-700 py-1 px-3 leading-8 transition-colors duration-200 ease-in-out"
        />
      </div>

      <!-- action buttons -->
      <div class="flex space-x-12">
        <button class="btn-main" (click)="pay('cash')">
          Cash On Delivery
          <i class="fas fa-cash-register"></i>
        </button>
        <button class="btn-main" (click)="pay('online')">
          Online Payment
          <i class="fas fa-credit-card"></i>
        </button>
      </div>
    </form>
  </div>
</section>
