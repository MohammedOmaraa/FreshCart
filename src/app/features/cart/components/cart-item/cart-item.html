<div
    class="group flex justify-between flex-col sm:flex-row bg-white dark:bg-primary-darker border rounded-2xl p-4 border-primary-dark/40 dark:border-white/30 hover:shadow-lg hover:border-primary/20 dark:hover:border-white/60 hover:shadow-primary/10 dark:hover:shadow-white/10 transition-all">

    <div class="flex items-start gap-5 flex-1">
        <!-- Product Image -->
        <div class="size-24 shrink-0 overflow-hidden rounded-xl flex justify-center items-center">
            <img [src]="item().product.imageCover" [alt]="item().product.title" class="size-24">
        </div>

        <!-- Product Info -->
        <div class="flex flex-col justify-between h-full py-1">
            <div>
                <a title="show details" [routerLink]="['/products/details/', item().product._id, item().product.category.slug]">
                    <h3
                        class="text-primary-darkest dark:text-white text-lg font-bold leading-tight mb-1 group-hover:text-primary transition-colors">
                        {{ item().product.title }}
                    </h3>
                </a>
                <p class="text-primary-darker dark:text-white/90 text-sm leading-normal max-w-lg">
                    {{ item().product.category.name}} - {{ item().product.subcategory[0].name}} - {{
                    item().product.brand.name }}
            </div>

            <!-- price -->
            <div class="flex mt-2 text-sm tracking-tight font-semibold gap-5">
                <!-- unit price -->
                <div class="">
                    <p class="uppercase text-primary-darkest dark:text-white">{{ 'cart.unitPrice' | translate }}</p>
                    <span class="text-primary-darkest dark:text-white">{{ item().price }}</span>
                </div>

                <!-- total price -->
                <div class="">
                    <p class="uppercase text-primary">{{ 'cart.total' | translate }}</p>
                    <span class="text-primary">{{ item().price*item().count }}</span>
                </div>

            </div>
        </div>
    </div>

    <!-- Action Controls -->
    <div
        class="flex sm:flex-col items-center justify-between sm:justify-center gap-4 sm:border-l sm:rtl:border-r sm:rtl:border-l-0 border-primary-darker/40 dark:border-white/90 sm:pl-6 sm:ml-2 sm:rtl:pl-0 sm:rtl:pr-6 sm:rtl:mr-2 sm:rtl:ml-0">
        <div class="flex items-center gap-1 rounded-full p-1.5 border border-primary-dark/40 dark:border-white/90">

            <!-- Decrease Product Count -->
            <button (click)="updateProduct(item().product._id ,item().count, -1)" [disabled]="!canDecrementCount()"
                class="disabled:cursor-not-allowed cursor-pointer size-8 flex items-center justify-center rounded-full text-primary-darker dark:text-white dark:bg-white/20 shadow-md shadow-primary-dark/20 dark:shadow-white/20 hover:bg-primary-dark/20 dark:hover:bg-primary-dark/90 transition-colors">
                <lucide-angular [img]="minusIcon" class="size-5"></lucide-angular>
            </button>

            <input
                class="w-8 p-0 text-center bg-transparent text-primary-darkest dark:text-white text-sm font-medium focus:outline-none border-none"
                readonly type="text" [value]="item().count">

            <!-- Increase Product Count -->
            <button (click)="updateProduct(item().product._id ,item().count, 1)"
                class="cursor-pointer size-8 flex items-center justify-center rounded-full text-white bg-primary hover:bg-primary-darkest/80 dark:hover:bg-primary/80 transition-colors">
                <lucide-angular [img]="plusIcon" class="size-5"></lucide-angular>
            </button>
        </div>

        <button (click)="deleteProduct(item().product._id)"
            class="text-primary-darkest dark:text-white cursor-pointer hover:text-red-400 p-2 rounded-full hover:bg-red-500/10 transition-colors"
            [title]="'cart.removeItem' | translate">
            <lucide-angular [img]="trashIcon" class="size-5"></lucide-angular>
        </button>
    </div>
</div>
