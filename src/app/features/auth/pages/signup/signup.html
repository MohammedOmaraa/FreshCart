<section>
  <div class="grid lg:grid-cols-2 gap-8 lg:gap-16 items-center">
    <div class="hidden lg:block">
      <div class="relative rounded-4xl overflow-hidden group dark:border-primary-dark border-2 border-transparent">
        <img class="w-full duration-700 group-hover:scale-110" alt="register" src="./images/login.png">

        <div class="absolute bottom-0 left-0 rtl:right-0 p-8 flex flex-col items-start gap-1">
          <div class="max-w-xl mx-auto lg:mx-0">
            <div
              class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-white/90 bg-primary/20 border border-primary/50 text-primary-200 text-xs font-semibold mb-4">
              <span class="w-2 h-2 rounded-full bg-primary"></span>
              {{'auth.signup.hero.badge'|translate}}
            </div>
            <h2 class="text-4xl lg:text-5xl font-bold tracking-tight mb-4 text-white">
              {{'auth.signup.hero.title'|translate}}</h2>
            <p class="text-lg text-white/80 max-w-md">{{'auth.signup.hero.subtitle'|translate}}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- signup form -->
    <app-singup-form />
  </div>

</section>
